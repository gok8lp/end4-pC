# G633 "Sinema" modu - Dolby Headphone / G HUB benzeri (taklit, gercek Dolby degil)
# Crossfeed + oda yansimalari + arka/yan HRTF + sinema tonu.
# Geri almak icin bu dosyayi sil ve: systemctl --user restart filter-chain
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "G633 Sinema (Dolby benzeri)"
            media.name       = "G633 Sinema (Dolby benzeri)"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = cpFL }
                    { type = builtin label = copy name = cpFR }
                    { type = builtin label = copy name = cpFC }
                    { type = builtin label = copy name = cpLFE }
                    { type = sofa label = spatializer name = spRL config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" } control = { "Azimuth" = 150.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spRR config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" } control = { "Azimuth" = 210.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spSL config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" } control = { "Azimuth" = 90.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spSR config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" } control = { "Azimuth" = 270.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = builtin label = mixer name = surL control = { "Gain 1" = 0.6 "Gain 2" = 0.6 "Gain 3" = 0.6 "Gain 4" = 0.6 } }
                    { type = builtin label = bq_highshelf name = shelfL control = { "Freq" = 3500.0 "Q" = 0.7 "Gain" = -7.0 } }
                    { type = builtin label = mixer name = surR control = { "Gain 1" = 0.6 "Gain 2" = 0.6 "Gain 3" = 0.6 "Gain 4" = 0.6 } }
                    { type = builtin label = bq_highshelf name = shelfR control = { "Freq" = 3500.0 "Q" = 0.7 "Gain" = -7.0 } }
                    { type = builtin label = delay name = xdL config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.0003 } }
                    { type = builtin label = bq_lowpass name = xlL control = { "Freq" = 700.0 "Q" = 0.7 } }
                    { type = builtin label = delay name = xdR config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.0003 } }
                    { type = builtin label = bq_lowpass name = xlR control = { "Freq" = 700.0 "Q" = 0.7 } }
                    { type = builtin label = mixer name = rmL control = { "Gain 1" = 0.22 "Gain 2" = 0.16 "Gain 3" = 0.12 } }
                    { type = builtin label = delay name = rdL1 config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.011 } }
                    { type = builtin label = delay name = rdL2 config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.017 } }
                    { type = builtin label = delay name = rdL3 config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.023 } }
                    { type = builtin label = bq_lowpass name = rlL control = { "Freq" = 4500.0 "Q" = 0.7 } }
                    { type = builtin label = mixer name = rmR control = { "Gain 1" = 0.22 "Gain 2" = 0.16 "Gain 3" = 0.12 } }
                    { type = builtin label = delay name = rdR1 config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.013 } }
                    { type = builtin label = delay name = rdR2 config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.019 } }
                    { type = builtin label = delay name = rdR3 config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.029 } }
                    { type = builtin label = bq_lowpass name = rlR control = { "Freq" = 4500.0 "Q" = 0.7 } }
                    { type = builtin label = bq_lowpass name = lfeLP control = { "Freq" = 120.0 "Q" = 0.7 } }
                    { type = builtin label = mixer name = mixL control = { "Gain 1" = 0.85 "Gain 2" = 0.3 "Gain 3" = 0.7 "Gain 4" = 0.6 "Gain 5" = 1.0 "Gain 6" = 1.0 } }
                    { type = builtin label = bq_lowshelf name = bassL control = { "Freq" = 110.0 "Q" = 0.7 "Gain" = 4.0 } }
                    { type = builtin label = bq_peaking name = presL control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 1.5 } }
                    { type = builtin label = mixer name = mixR control = { "Gain 1" = 0.85 "Gain 2" = 0.3 "Gain 3" = 0.7 "Gain 4" = 0.6 "Gain 5" = 1.0 "Gain 6" = 1.0 } }
                    { type = builtin label = bq_lowshelf name = bassR control = { "Freq" = 110.0 "Q" = 0.7 "Gain" = 4.0 } }
                    { type = builtin label = bq_peaking name = presR control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 1.5 } }
                ]
                links = [
                    { output = "cpFR:Out" input = "xdL:In" }
                    { output = "xdL:Out" input = "xlL:In" }
                    { output = "cpFL:Out" input = "xdR:In" }
                    { output = "xdR:Out" input = "xlR:In" }
                    { output = "cpFL:Out" input = "rdL1:In" }
                    { output = "rdL1:Out" input = "rmL:In 1" }
                    { output = "cpFR:Out" input = "rdL2:In" }
                    { output = "rdL2:Out" input = "rmL:In 2" }
                    { output = "cpFC:Out" input = "rdL3:In" }
                    { output = "rdL3:Out" input = "rmL:In 3" }
                    { output = "rmL:Out" input = "rlL:In" }
                    { output = "cpFR:Out" input = "rdR1:In" }
                    { output = "rdR1:Out" input = "rmR:In 1" }
                    { output = "cpFL:Out" input = "rdR2:In" }
                    { output = "rdR2:Out" input = "rmR:In 2" }
                    { output = "cpFC:Out" input = "rdR3:In" }
                    { output = "rdR3:Out" input = "rmR:In 3" }
                    { output = "rmR:Out" input = "rlR:In" }
                    { output = "cpLFE:Out" input = "lfeLP:In" }
                    { output = "spRL:Out L" input = "surL:In 1" }
                    { output = "spRL:Out R" input = "surR:In 1" }
                    { output = "spRR:Out L" input = "surL:In 2" }
                    { output = "spRR:Out R" input = "surR:In 2" }
                    { output = "spSL:Out L" input = "surL:In 3" }
                    { output = "spSL:Out R" input = "surR:In 3" }
                    { output = "spSR:Out L" input = "surL:In 4" }
                    { output = "spSR:Out R" input = "surR:In 4" }
                    { output = "surL:Out" input = "shelfL:In" }
                    { output = "cpFL:Out" input = "mixL:In 1" }
                    { output = "xlL:Out" input = "mixL:In 2" }
                    { output = "cpFC:Out" input = "mixL:In 3" }
                    { output = "lfeLP:Out" input = "mixL:In 4" }
                    { output = "shelfL:Out" input = "mixL:In 5" }
                    { output = "rlL:Out" input = "mixL:In 6" }
                    { output = "mixL:Out" input = "bassL:In" }
                    { output = "bassL:Out" input = "presL:In" }
                    { output = "surR:Out" input = "shelfR:In" }
                    { output = "cpFR:Out" input = "mixR:In 1" }
                    { output = "xlR:Out" input = "mixR:In 2" }
                    { output = "cpFC:Out" input = "mixR:In 3" }
                    { output = "lfeLP:Out" input = "mixR:In 4" }
                    { output = "shelfR:Out" input = "mixR:In 5" }
                    { output = "rlR:Out" input = "mixR:In 6" }
                    { output = "mixR:Out" input = "bassR:In" }
                    { output = "bassR:Out" input = "presR:In" }
                ]
                inputs  = [ "cpFL:In" "cpFR:In" "cpFC:In" "cpLFE:In" "spRL:In" "spRR:In" "spSL:In" "spSR:In" ]
                outputs = [ "presL:Out" "presR:Out" ]
            }
            capture.props = {
                node.name      = "g633_sinema"
                media.class    = Audio/Sink
                audio.channels = 8
                audio.position = [ FL FR FC LFE RL RR SL SR ]
            }
            playback.props = {
                node.name      = "g633_sinema.output"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
                target.object  = "alsa_output.usb-Logitech_Logitech_G633_Gaming_Headset_00000000-00.analog-stereo"
                node.dont-reconnect = true
            }
        }
    }
]
